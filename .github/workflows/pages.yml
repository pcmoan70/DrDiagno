name: Deploy Dr. Diagno to GitHub Pages
on:
  push:
    branches: [main]
    paths: ['game/web/**', 'game/tests/**', '.github/workflows/pages.yml']
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  test-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Served folder must hold only the site (no tests, build scripts or raw data)
        run: test -z "$(find game/web -name '*.py' -o -name '*.test.js' -o -name package.json -o -name 'tests' -type d)"
      - name: Engine tests (needs data bundles in game/web/data)
        run: cd game && test -f web/data/terms.json && npm test || echo "data bundles not committed; skipping tests"
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: game/web
      - id: deployment
        uses: actions/deploy-pages@v4
