# ---------------------------------------------------------------- 02_disease_symptom_knowledge
- id: monarch_kg
  category: 02_disease_symptom_knowledge
  source: url
  name: Monarch Knowledge Graph (latest release)
  url: https://monarchinitiative.org
  license: CC BY 4.0 (component sources keep their own licences)
