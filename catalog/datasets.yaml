# Catalog of open diagnosis datasets. One entry per dataset.
#   id        : directory name under <data_root>/<category>/
#   category  : top-level folder on the drive
#   source    : url | hf | kaggle | manual
#   files     : (url) list of {url, name}
#   repo      : (hf) dataset repo id            slug: (kaggle) owner/dataset
#   license   : licence as stated by the publisher
#   coverage  : what diseases/symptoms it covers (for the README)
#   note      : (manual) how to obtain

# ---------------------------------------------------------------- 01_ontologies_terminologies
- id: hpo
  category: 01_ontologies_terminologies
  source: url
  name: Human Phenotype Ontology + disease annotations
  url: https://hpo.jax.org
  license: HPO licence (free use with attribution)
  coverage: ~18k phenotypic-abnormality terms; phenotype.hpoa ~270k disease–phenotype annotations with frequency for ~12k diseases (OMIM, Orphanet, DECIPHER)
  files:
  - url: https://github.com/obophenotype/human-phenotype-ontology/releases/latest/download/hp.obo
    name: hp.obo
  - url: https://github.com/obophenotype/human-phenotype-ontology/releases/latest/download/hp.json
    name: hp.json
  - url: https://github.com/obophenotype/human-phenotype-ontology/releases/latest/download/phenotype.hpoa
    name: phenotype.hpoa
  - url: https://github.com/obophenotype/human-phenotype-ontology/releases/latest/download/genes_to_phenotype.txt
    name: genes_to_phenotype.txt
  - url: https://github.com/obophenotype/human-phenotype-ontology/releases/latest/download/phenotype_to_genes.txt
    name: phenotype_to_genes.txt

- id: mondo
  category: 01_ontologies_terminologies
  source: url
  name: Mondo Disease Ontology
  url: https://mondo.monarchinitiative.org
  license: CC BY 4.0
  coverage: ~25k+ disease classes unifying OMIM, Orphanet, DOID, ICD, MeSH, NCIt, SNOMED cross-references
  files:
  - url: http://purl.obolibrary.org/obo/mondo.obo
    name: mondo.obo
  - url: http://purl.obolibrary.org/obo/mondo.json
    name: mondo.json

- id: doid
  category: 01_ontologies_terminologies
  source: url
  name: Human Disease Ontology
  url: https://disease-ontology.org
  license: CC0 1.0
  coverage: ~11k human disease terms with definitions, synonyms and xrefs (ICD, MeSH, OMIM, SNOMED, UMLS)
  files:
  - url: http://purl.obolibrary.org/obo/doid.obo
    name: doid.obo
  - url: http://purl.obolibrary.org/obo/doid.json
    name: doid.json

- id: symp
  category: 01_ontologies_terminologies
  source: url
  name: Symptom Ontology (SYMP)
  url: https://github.com/DiseaseOntology/SymptomOntology
  license: CC0 1.0
  coverage: ~940 symptom terms, hierarchical
  files:
  - url: http://purl.obolibrary.org/obo/symp.obo
    name: symp.obo
  - url: http://purl.obolibrary.org/obo/symp.json
    name: symp.json

- id: mesh_2026
  category: 01_ontologies_terminologies
  source: url
  name: MeSH 2026 (descriptors, qualifiers, supplementary concept records)
  url: https://www.nlm.nih.gov/databases/download/mesh.html
  license: NLM terms (free, public domain in the US; cite NLM)
